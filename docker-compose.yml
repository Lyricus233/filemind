services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: filemind
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: filemind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "filemind", "-d", "filemind"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: